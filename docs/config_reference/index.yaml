# Page identity. `package` is the distribution name, used for the version and browser storage. Optional
# `validate_command` is suggested by the builder for a full check of the downloaded file.
page:
  package: anemoi-inference
  title: Inference configuration reference
  description: What every key of an anemoi-inference run configuration accepts, with examples and a configuration builder.
  config_file: config.yaml
  # Relative to the built page, which Sphinx writes to `config-reference/` next to the documentation.
  docs_link: {url: ../index.html, label: anemoi-inference docs}
  notice: |
    This page is experimental and still being explored. Please share feedback on
    [GitHub issue #680](https://github.com/ecmwf/anemoi-inference/issues/680).

intro: |
  An anemoi-inference run is described by one YAML file. Pick a section on the left to see what each key
  accepts, then use **Add to config** to assemble a configuration and download it.

  Most components can be written in three ways:

  - just the name, when no options are needed: `output: printer`
  - the name and one main value: `output: {grib: forecast.grib}`
  - the name and a mapping of options: `output: {grib: {path: forecast.grib, encoding: {...}}}`

# Parameters that take other components, keyed by `name`, `kind.name` or `kind/component.name`.
# Used by `refgen.py generate` to link fields and to build nested examples.
field_refs:
  pre_processors: {ref: pre_processors, many: true}
  post_processors: {ref: post_processors, many: true}
  outputs.output: {ref: outputs}
  outputs/tee.args: {ref: outputs, many: true}
  outputs/tee.outputs: {ref: outputs, many: true}
  outputs/grib.templates: {ref: grib_templates, many: true}
  inputs/repeated-dates.source: {ref: inputs}
  runners/parallel.base_runner: {ref: runners}
  runners/parallel.cluster: {ref: clusters}

# Per kind: `registry` to document, `slot`/`path` where components go in a run configuration (`path` segments
# alternate key and component name; `[]` marks a list), `exclude`d names, `injected` constructor parameters set
# by anemoi-inference, and `hidden` internal parameters.
kinds:
  config:
    title: Top-level options
    summary: Keys at the root of the configuration file.

  runners:
    title: Runners
    summary: How the model is run. Set with the top-level `runner` key.
    registry: anemoi.inference.runners:runner_registry
    slot: runner
    hidden: [classes]
    exclude:
      no-model: Testing only. Replaces the model with dummy values.
      simple: Python API only. Not usable from a configuration file.

  inputs:
    title: Inputs
    summary: Where initial conditions and forcings come from. Set with `input`, `constant_forcings` or `dynamic_forcings`.
    registry: anemoi.inference.inputs:input_registry
    slot: input
    hidden: [purpose]

  outputs:
    title: Outputs
    summary: Where and how forecasts are written. Set with the top-level `output` key.
    registry: anemoi.inference.outputs:output_registry
    slot: output

  pre_processors:
    title: Pre-processors
    summary: Applied to input fields before they reach the model. Listed under `pre_processors`, at top level or on an input.
    registry: anemoi.inference.pre_processors:pre_processor_registry
    slot: pre_processors
    path: pre_processors[]

  post_processors:
    title: Post-processors
    summary: Applied to forecast states before they are written. Listed under `post_processors`, at top level or on an output.
    registry: anemoi.inference.post_processors:post_processor_registry
    slot: post_processors
    path: post_processors[]

  clusters:
    title: Clusters
    summary: How processes find each other when using the `parallel` runner. Set with `runner.parallel.cluster`.
    registry: anemoi.inference.clusters:cluster_registry
    path: runner.parallel.cluster

  grib_templates:
    title: GRIB templates
    summary: Where GRIB outputs find templates for encoding fields. Set with `templates` on a GRIB output.
    registry: anemoi.inference.grib.templates:template_provider_registry
    injected: [manager]
    path: output.grib.templates[]
