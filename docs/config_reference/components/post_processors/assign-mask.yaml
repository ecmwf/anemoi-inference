name: assign-mask
status: reviewed
summary: Assign the state to a larger array using a mask.
description: |
  This is the opposite of `extract_mask`: instead of extracting a smaller area, it assigns data to a portion of a
  larger area. Areas not covered by the mask are filled with `fill_value` (NaN by default).
positional: mask
fields:
  mask:
    type: str
    required: true
    description: The name of the mask supporting array or a path to a file containing the mask.
  fill_value:
    type: float
    default: .nan
    description: The value to fill the non-assigned area, by default NaN.
see_also: [post_processors/extract-mask]
