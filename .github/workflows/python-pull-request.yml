# This workflow runs pre-commit checks and pytest tests against multiple platforms and Python versions.
name: Code Quality and Testing

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  schedule:
    - cron: "9 2 * * 0" # at 9:02 on sunday

jobs:
  quality:
    uses: ecmwf/reusable-workflows/.github/workflows/qa-precommit-run.yml@v2
    with:
      skip-hooks: "no-commit-to-branch"

  # The reusable qa-pytest-pyproject workflow pins runs-on to ubuntu-latest (2
  # cores), which caps what `pytest -n auto` can do. Inlined here so the tests
  # run on the arc-runner-very-large scale set instead, inside the org's public
  # Ubuntu CI image (see ecmwf/ci-infrastructure smoke-test-runners.yml).
  checks:
    name: pytest (python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: arc-runner-very-large
    container:
      image: eccr.ecmwf.int/public-ci-images/ubuntu24.04-base:latest
    env:
      # torch pulls the whole CUDA stack (~2.9GB of nvidia-* wheels) by default;
      # none of it can run on a CPU runner, and the cluster's link to PyPI is
      # slow enough that downloading it dominated the job.
      UV_TORCH_BACKEND: cpu
      # ARC overlays the workspace per job, so uv's default cache lands on a
      # different filesystem than .venv and every file gets copied instead of
      # hardlinked. Keeping both on the same mount restores hardlinking.
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Report runner sizing
        run: |
          echo "nproc: $(nproc)"
          python3 -c 'import os; print("affinity:", len(os.sched_getaffinity(0)))'
          free -h || true

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Create virtualenv
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv pip install .[all,tests] pytest

      - name: Run pytest
        run: .venv/bin/pytest -v
