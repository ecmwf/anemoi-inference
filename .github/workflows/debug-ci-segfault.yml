# Temporary workflow to investigate the segfault in the plot integration tests.
# Replicates ecmwf/reusable-workflows/.github/workflows/qa-pytest-pyproject.yml@v2
# with diagnostics added. Delete once the cause is found.
name: Debug CI Segfault

on:
  push:
    branches:
      - "debug/**"
  workflow_dispatch:

env:
  UV_SYSTEM_PYTHON: 1
  PYTHONFAULTHANDLER: 1
  PYTHONPATH: .

jobs:
  debug:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    name: debug (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install dependencies
        run: uv pip install .[all,tests] pytest pytest-md pytest-emoji

      - name: Record environment
        run: |
          python -VV
          uname -a
          echo "::group::pip freeze"
          uv pip freeze | sort
          echo "::endgroup::"

      - name: Write diagnostic scripts
        run: |
          cat > ne_probe.py <<'PY'
          """Load one Natural Earth layer and report its size and record count."""

          import hashlib
          import sys
          from pathlib import Path

          import cartopy.io.shapereader as shapereader

          resolution, category, name = sys.argv[1:4]
          path = Path(shapereader.natural_earth(resolution=resolution, category=category, name=name))
          sizes = {
              suffix: path.with_suffix(suffix).stat().st_size
              for suffix in (".shp", ".dbf", ".shx")
              if path.with_suffix(suffix).exists()
          }
          print(f"  sha256(shp)={hashlib.sha256(path.read_bytes()).hexdigest()[:16]} sizes={sizes}", flush=True)
          print(f"  reader={shapereader.Reader.__name__}", flush=True)
          print(f"  records={len(list(shapereader.Reader(path).records()))}", flush=True)
          PY
          cat > ne_trace.py <<'PY'
          """Pytest plugin logging the shapefile requested immediately before a crash."""

          import cartopy.io.shapereader as shapereader

          _natural_earth = shapereader.natural_earth
          _Reader = shapereader.Reader


          def natural_earth(*args, **kwargs):
              path = _natural_earth(*args, **kwargs)
              print(f"[ne_trace] natural_earth({args}, {kwargs}) -> {path}", flush=True)
              return path


          def Reader(filename, *args, **kwargs):
              print(f"[ne_trace] Reader({filename}) via {_Reader.__name__}", flush=True)
              return _Reader(filename, *args, **kwargs)


          shapereader.natural_earth = natural_earth
          shapereader.Reader = Reader
          PY

      # Each layer is loaded in its own process, so one segfault does not abort
      # the sweep. Known-good local baseline for physical/coastline:
      # 110m=134, 50m=1428, 10m=4133 records.
      - name: Sweep Natural Earth layers
        continue-on-error: true
        run: |
          failed=""
          for resolution in 110m 50m 10m; do
            for layer in physical/coastline physical/land physical/ocean \
                         cultural/admin_0_boundary_lines_land cultural/admin_0_countries; do
              echo "::group::${resolution} ${layer}"
              if python ne_probe.py "${resolution}" "${layer%%/*}" "${layer##*/}"; then
                echo "  exit=0"
              else
                rc=$?
                echo "  exit=${rc} <-- FAILED"
                failed="${failed}${resolution} ${layer} (exit ${rc})"$'\n'
              fi
              echo "::endgroup::"
            done
          done
          echo "=== layers that did not load cleanly ==="
          echo "${failed:-none}"

      - name: Plot case in isolation (control)
        continue-on-error: true
        run: |
          pytest -vv -s -p ne_trace \
            "tests/integration/test_integration.py::test_integration[single-o48-1.1/grib-in-plots-out]"

      # cartopy uses FionaReader only when fiona is importable, and otherwise
      # falls back to BasicReader (pyshp). earthkit-plots imports fiona lazily
      # and only for GISCO layers, so Natural Earth plotting still works.
      # If this passes, the fault is in fiona/GDAL rather than in the test.
      - name: Plot case without fiona
        continue-on-error: true
        run: |
          uv pip uninstall fiona
          python -c "import cartopy.io.shapereader as s; print('Reader is', s.Reader.__name__)"
          pytest -vv -s -p ne_trace \
            "tests/integration/test_integration.py::test_integration[single-o48-1.1/grib-in-plots-out]"
