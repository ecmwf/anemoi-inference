# Temporary workflow to investigate the segfault in the plot integration tests.
# Replicates ecmwf/reusable-workflows/.github/workflows/qa-pytest-pyproject.yml@v2
# with diagnostics added. Delete once the cause is found.
name: Debug CI Segfault

on:
  push:
    branches:
      - "debug/**"
  workflow_dispatch:

env:
  UV_SYSTEM_PYTHON: 1
  PYTHONFAULTHANDLER: 1

jobs:
  debug:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    name: debug (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install dependencies
        run: uv pip install .[all,tests] pytest pytest-md pytest-emoji

      - name: Record environment
        run: |
          python -VV
          uv --version
          uname -a
          echo "::group::pip freeze"
          uv pip freeze | sort
          echo "::endgroup::"

      - name: Probe native libraries
        continue-on-error: true
        run: |
          python - <<'PY'
          import faulthandler
          faulthandler.enable()

          import torch  # noqa: F401
          import earthkit.data  # noqa: F401
          import earthkit.plots  # noqa: F401
          import cartopy.io.shapereader as shapereader

          print("Reader:", shapereader.Reader)

          keys = ("geos", "proj", "gdal", "stdc++", "gomp", "sqlite", "tiff")
          seen = []
          for line in open("/proc/self/maps"):
              if ".so" not in line:
                  continue
              path = line.split()[-1]
              if any(k in path.lower() for k in keys) and path not in seen:
                  seen.append(path)
          print("::group::native libraries")
          print("\n".join(seen))
          print("::endgroup::")

          path = shapereader.natural_earth(resolution="50m", category="physical", name="coastline")
          print("shapefile:", path)
          print("records:", len(list(shapereader.Reader(path).records())))
          PY

      - name: Plot case in isolation
        continue-on-error: true
        run: |
          pytest -vv -s \
            "tests/integration/test_integration.py::test_integration[single-o48-1.1/grib-in-plots-out]"

      - name: Plot case after preceding cases
        continue-on-error: true
        run: |
          pytest -vv -s \
            "tests/integration/test_integration.py::test_integration[single-o48-1.1/grib-in-grib-out]" \
            "tests/integration/test_integration.py::test_integration[single-o48-1.1/grib-in-grib-parallel-out]" \
            "tests/integration/test_integration.py::test_integration[single-o48-1.1/grib-in-grib-out-limit-vars]" \
            "tests/integration/test_integration.py::test_integration[single-o48-1.1/grib-in-netcdf-out]" \
            "tests/integration/test_integration.py::test_integration[single-o48-1.1/grib-in-zarr-out]" \
            "tests/integration/test_integration.py::test_integration[single-o48-1.1/grib-in-plots-out]"

      - name: Full suite
        continue-on-error: true
        run: pytest -vv
