# Temporary workflow to investigate the segfault in the plot integration tests.
# Replicates ecmwf/reusable-workflows/.github/workflows/qa-pytest-pyproject.yml@v2
# with diagnostics added. Delete once the cause is found.
name: Debug CI Segfault

on:
  push:
    branches:
      - "debug/**"
  workflow_dispatch:

env:
  UV_SYSTEM_PYTHON: 1
  PYTHONFAULTHANDLER: 1
  PLOT_TEST: "tests/integration/test_integration.py::test_integration[single-o48-1.1/grib-in-plots-out]"

jobs:
  debug:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    name: debug (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install dependencies
        run: uv pip install .[all,tests] pytest pytest-md pytest-emoji

      - name: Record environment
        run: |
          python -VV
          uname -a
          echo "::group::pip freeze"
          uv pip freeze | sort
          echo "::endgroup::"

      # Which PROJ / SQLite / GEOS builds each wheel ships, and which ones
      # libgdal is linked against.
      - name: Native library inventory
        run: |
          SP=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          for libs in fiona.libs shapely.libs pyproj.libs eckitlib.libs; do
            echo "::group::${libs}"
            ls -1 "${SP}/${libs}" 2>/dev/null | grep -iE "proj|sqlite|geos|gdal|tiff|curl|stdc" || echo "(none matching)"
            echo "::endgroup::"
          done
          echo "::group::libgdal NEEDED"
          for so in "${SP}"/fiona.libs/libgdal*; do
            [ -f "${so}" ] || { echo "(no libgdal in fiona.libs)"; break; }
            readelf -d "${so}" | grep NEEDED | sed -E 's/.*\[(.*)\]/\1/'
          done
          echo "::endgroup::"

      - name: Install gdb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdb

      # Exact invocation from the failing job. On SIGSEGV, gdb prints the
      # native frames and every shared object mapped into the process.
      - name: Plot case under gdb (baseline)
        continue-on-error: true
        run: |
          gdb -q -batch \
            -ex "set pagination off" \
            -ex "set print thread-events off" \
            -ex "run" \
            -ex "echo \n::group::native backtrace\n" \
            -ex "bt 40" \
            -ex "echo ::endgroup::\n" \
            -ex "echo ::group::info sharedlibrary\n" \
            -ex "info sharedlibrary" \
            -ex "echo ::endgroup::\n" \
            --args python -m pytest -x -p no:cacheprovider "${PLOT_TEST}"

      # eccodeslib and odclib pin eckitlib to an exact build, so all three
      # move together. 2.2.0.27 is the last eckitlib without a bundled
      # libproj/libsqlite3, and the last set in a green run.
      - name: Plot case with the .27 ECMWF library set
        continue-on-error: true
        run: |
          uv pip install "eccodeslib==2.48.2.27" "eckitlib==2.2.0.27" "odclib==1.6.3.27"
          uv pip freeze | grep -iE "^(eccodeslib|eckitlib|odclib)=="
          pytest -vv "${PLOT_TEST}"
